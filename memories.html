      HOW TO ADD YOUR PHOTOS:
      1. Upload your photos to a folder called "images" in your repo.
      2. For each photo, replace the <div class="placeholder">...</div> line with:
           <img src="images/your-photo-name.jpg" alt="describe the photo">
      3. Change the caption text underneath.
      Copy a whole <figure>...</figure> block to add more photos.
    -->
    <div class="gallery">
      <figure class="photo">
        <div class="placeholder">📷</div>
        <figcaption>[Caption: where and when]</figcaption>
