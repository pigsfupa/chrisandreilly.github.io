  <main class="container">

      Each photo is one <figure> block. To change a caption, edit the text inside <figcaption>.

    -->
    <div class="gallery">

      <figure class="photo">
        <img src="chrisimages/mainchris.jpg" alt="Chris" loading="lazy">
        <figcaption>My favorite human</figcaption>
      </figure>

      <figure class="photo">
        <img src="chrisimages/chris%20photo%20images/image%3Aacl.jpeg" alt="Us at ACL" loading="lazy">

      <figure class="photo">

        <img src="chrisimages/chris%20photo%20images/baseballgame.jpg" alt="At a baseball game" loading="lazy">

      <figure class="photo">
        <img src="chrisimages/chrispumpkin.jpg" alt="Chris with a pumpkin" loading="lazy">

      </figure>

      <figure class="photo">
